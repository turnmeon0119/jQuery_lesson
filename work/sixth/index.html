<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
  const searchHtml = `
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  `;
  const encountHtml = `
    <p class="name"></p>
    <div><img class="img" src="" alt=""></div>
    <div>
      <button class="btn" id="catch">捕まえる</button>
      <button class="btn" data-js="reset">逃げる</button>
    </div>
  `;
  const doneHtml = `
    <p class="name">ゲットしました</p>
    <div><img class="img" src="" alt=""></div>
    <button class="btn" data-js="reset">戻る</button>
  `;
  const failHtml = `
    <p class="text">逃げられてしまった...</p>
    <button class="btn mt" data-js="reset">戻る</button>
  `;

  const POKEMON_API = id => `https://pokeapi.co/api/v2/pokemon/${id}`;
  const BALL_API = 'https://pokeapi.co/api/v2/item/4';

    function render(html) {
      $('#wrapper').html(html);
    }

    $(function () {
      render(searchHtml);
    });

    $(document).on('click', '#pokemon_search', function () {
      const id = Math.floor(Math.random() * 151) + 1;
      $.ajax({
        url: POKEMON_API(id),
        method: 'GET',
        dataType: 'json'
      }).done(function (pokemon) {
        render(encountHtml);
        const sprite = pokemon.sprites.front_default || '';
        $('.img').attr('src', sprite).attr('alt', pokemon.name);

        $.ajax({
          url: pokemon.species.url,
          method: 'GET',
          dataType: 'json'
        }).done(function (species) {
          const jp = species.names.find(n => n.language.name === 'ja');
          const jpName = jp ? jp.name : (pokemon.name.charAt(0).toUpperCase() + pokemon.name.slice(1));
          $('.name').text(jpName);
        }).fail(function () {
          const en = pokemon.name.charAt(0).toUpperCase() + pokemon.name.slice(1);
          $('.name').text(en);
        });
      }).fail(function () {
        alert('ポケモンの取得に失敗しました。');
      });
    });

    $(document).on('click', '#catch', function () {
      const success = Math.random() < 0.5;
      if (success) {
        render(doneHtml);
        $.ajax({
          url: BALL_API,
          method: 'GET',
          dataType: 'json'
        }).done(function (item) {
          const ball = item.sprites && item.sprites.default ? item.sprites.default : '';
          $('.img').attr('src', ball).attr('alt', 'Poké Ball');
        });
      } else {
        render(failHtml);
      }
    });

    $(document).on('click', '[data-js="reset"]', function () {
      render(searchHtml);
    });
  </script>
</body>
</html>
